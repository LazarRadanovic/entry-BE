# Local development stack.
#   docker compose up -d postgres          -> only the database (run the backend from your IDE / ./mvnw spring-boot:run)
#   docker compose up --build              -> database + backend + frontend (http://localhost:4200)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entry
      POSTGRES_USER: entry
      POSTGRES_PASSWORD: entry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entry -d entry"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/entry
      DB_USERNAME: entry
      DB_PASSWORD: entry
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      COOKIE_SECURE: "false"
      STORAGE_DIR: /app/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-30}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      BILLING_PRICE_LABEL: ${BILLING_PRICE_LABEL:-}
      APP_URL: ${APP_URL:-http://localhost:4200}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: "../entry FE"
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
  uploads:
